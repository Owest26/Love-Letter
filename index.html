<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>I love you❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap"rel="stylesheet"/>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Floating Hearts -->
  <div class="hearts"></div>

  <!-- Main Card -->
  <div class="card">

    <!-- Sparkles -->
    <div class="sparkle sparkle1"></div>
    <div class="sparkle sparkle2"></div>
    <div class="sparkle sparkle3"></div>
    <div class="sparkle sparkle4"></div>

    <!-- Flowers -->
    <div class="flowers">
      <div class="flower">🌸</div>
      <div class="flower">🌷</div>
      <div class="flower">🌹</div>
      <div class="flower">💐</div>
    </div>

    <!-- Content -->
    <div class="content">

      <h1>My love</h1>

      <p class="subtitle">
        To Portia ✨
      </p>

      <div class="big-heart">💖</div>

      <p class="message">
        Thank you for every smile, every laugh, every moment.
        I love you wennnna ❤️😍

      </p>

      <button class="btn" id="openBtn">
        Open Special Message
      </button>

    </div>

    <!-- Popup -->
    <div class="popup" id="popup">

      <div class="popup-box">

        <h2>I Love You Portia 💕</h2>

        <p>
          You make life beautiful with your kindness,
          warmth, strength, and endless love.
          This is all about celebrating YOU.
          You and I till the day we DIE.
          
        </p>

        <button class="close-btn" id="closeBtn">
          Close
        </button>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
